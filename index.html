<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Printforsider — Movia</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --movia: #003865;
    --blue: #2563EB;
    --blue-light: #EFF6FF;
    --green: #16a34a;
    --green-light: #dcfce7;
    --red: #dc2626;
    --red-light: #fee2e2;
    --orange: #ea580c;
    --gray-50: #f8fafc;
    --gray-100: #f1f5f9;
    --gray-200: #e2e8f0;
    --gray-300: #cbd5e1;
    --gray-500: #64748b;
    --gray-700: #334155;
    --gray-900: #0f172a;
    --text: #1e293b;
    --radius: 10px;
    --shadow: 0 1px 3px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.05);
    --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px rgba(0,0,0,0.04);
  }

  body { font-family: 'Inter', system-ui, sans-serif; background: var(--gray-50); color: var(--text); min-height: 100vh; }

  header {
    background: var(--movia);
    padding: 0 32px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .header-brand { display: flex; align-items: center; gap: 12px; }
  .logo { width: 36px; height: 36px; background: white; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.75rem; color: var(--movia); }
  .header-title { color: white; font-size: 1rem; font-weight: 600; }
  .header-sub { color: rgba(255,255,255,0.5); font-size: 0.78rem; }
  .header-date { color: rgba(255,255,255,0.5); font-size: 0.8rem; }

  main { padding: 28px 32px; max-width: 1400px; margin: 0 auto; }

  .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }

  .kpi-card {
    background: white;
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow);
    border: 1px solid var(--gray-200);
    transition: box-shadow 0.15s, border-color 0.15s;
  }
  .kpi-card[role="button"] { cursor: pointer; }
  .kpi-card[role="button"]:hover { box-shadow: var(--shadow-md); border-color: var(--gray-300); }
  .kpi-card[role="button"]:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

  .kpi-label { font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--gray-500); margin-bottom: 8px; }
  .kpi-value { font-size: 2rem; font-weight: 700; line-height: 1; margin-bottom: 4px; }
  .kpi-meta { font-size: 0.78rem; color: var(--gray-500); margin-bottom: 12px; }
  .kpi-bar { height: 4px; background: var(--gray-100); border-radius: 2px; overflow: hidden; }
  .kpi-bar-fill { height: 100%; border-radius: 2px; transition: width 0.7s cubic-bezier(0.4,0,0.2,1); width: 0%; }

  .c-alle .kpi-value { color: var(--movia); }
  .c-alle .kpi-bar-fill { background: var(--movia); }
  .c-klar .kpi-value { color: var(--blue); }
  .c-klar .kpi-bar-fill { background: var(--blue); }
  .c-printet .kpi-value { color: var(--green); }
  .c-printet .kpi-bar-fill { background: var(--green); }
  .c-mangler .kpi-value { color: var(--orange); }
  .c-mangler .kpi-bar-fill { background: var(--orange); }

  .panel { background: white; border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--gray-200); overflow: hidden; }

  .panel-toolbar {
    padding: 14px 20px;
    border-bottom: 1px solid var(--gray-100);
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }

  .search-wrap { position: relative; }
  .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--gray-500); pointer-events: none; }

  input[type="search"] {
    padding: 7px 12px 7px 32px;
    border: 1px solid var(--gray-200);
    border-radius: 7px;
    font-size: 0.875rem;
    font-family: inherit;
    width: 200px;
    outline: none;
    background: var(--gray-50);
    color: var(--text);
    transition: border-color 0.15s;
  }
  input[type="search"]:focus { border-color: var(--blue); background: white; }

  .filter-group { display: flex; gap: 6px; flex-wrap: wrap; }

  .filter-btn {
    padding: 6px 12px;
    border: 1px solid var(--gray-200);
    border-radius: 6px;
    background: var(--gray-50);
    font-size: 0.8rem;
    font-family: inherit;
    font-weight: 500;
    cursor: pointer;
    color: var(--gray-700);
    transition: all 0.15s;
    white-space: nowrap;
  }
  .filter-btn:hover { background: white; border-color: var(--gray-300); }
  .filter-btn.active { background: var(--movia); color: white; border-color: var(--movia); }
  .filter-btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

  .panel-stats { margin-left: auto; font-size: 0.8rem; color: var(--gray-500); white-space: nowrap; }

  table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
  thead tr { background: var(--gray-50); border-bottom: 1px solid var(--gray-200); }
  th { text-align: left; padding: 10px 16px; font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--gray-500); white-space: nowrap; }
  tbody tr { border-bottom: 1px solid var(--gray-100); transition: background 0.1s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--gray-50); }
  td { padding: 10px 16px; vertical-align: middle; }

  .linje-badge { font-weight: 700; font-size: 0.9rem; color: var(--movia); background: #e8f0f9; padding: 3px 9px; border-radius: 5px; display: inline-block; }

  .ret-navn { color: var(--gray-700); line-height: 1.4; }
  .ret-stop { font-size: 0.72rem; color: var(--gray-500); display: block; margin-top: 2px; }

  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; white-space: nowrap; }
  .badge-ja { background: var(--green-light); color: var(--green); }
  .badge-nej { background: var(--red-light); color: var(--red); }
  .badge-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; display: inline-block; flex-shrink: 0; }

  .empty-cell { text-align: center; padding: 60px; color: var(--gray-500); font-size: 0.9rem; }

  @media (max-width: 900px) {
    main { padding: 16px; }
    header { padding: 0 16px; }
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 500px) {
    .kpi-grid { gap: 10px; }
    .kpi-value { font-size: 1.6rem; }
    input[type="search"] { width: 150px; }
  }
</style>
</head>

<header>
  <div class="header-brand">

</header>

<main>

      <tbody id="tbody"></tbody>
    </table>
  </div>
</main>

  ["640","Næstved St. - Vordingborg St.","","Vordingborg St. - Næstved St.","","FALSK","FALSK"],
  ["660R","Vordingborg St. - Stege","","Stege - Vordingborg St.","","FALSK","FALSK"],
  ["680R","Næstved - Ringsted St.","","Ringsted - Næstved","","FALSK","FALSK"],
  ["720R","Maribo St. - Rødby Færge","","Rødby Færge - Maribo St.","","FALSK","FALSK"],
  ["750","Stege - Nykøbing F St.","","Nykøbing F St. - Stege","","FALSK","FALSK"],
  ["961","Lilla Fribus Slagelse","","Lilla Fribus Slagelse","","FALSK","FALSK"],
  ["962","Blå Fribus Slagelse","","Blå Fribus Slagelse","","FALSK","FALSK"],
  ["963","Rød Fribus Slagelse","","Rød Fribus Slagelse","","FALSK","FALSK"],
  ["970N","Køge St. - Roskilde St.","","Roskilde St. - Køge St.","","FALSK","FALSK"],
  ["971N","Køge St. - Faxe Ladeplads St.","","Faxe Ladeplads St. - Køge St.","","FALSK","FALSK"],
  ["972N","Køge St. - Rødvig St.","","Rødvig St. - Køge St.","","FALSK","FALSK"],
  ["993","Nyhavn - Operaen","","Operaen - Nyhavn","","FALSK","FALSK"],
];

const total = data.length;
const klarCount = data.filter(r => r[5] === 'SAND').length;
const printetCount = data.filter(r => r[6] === 'SAND').length;
const manglerCount = data.filter(r => r[5] === 'FALSK').length;

const kpiDefs = [
  { cls:'c-alle',    label:'Linjer i alt',   value:total,        meta:'samlet',                                    pct:100,                      filter:null },
  { cls:'c-klar',    label:'Klar til print', value:klarCount,    meta:Math.round(klarCount/total*100)+'% af alle', pct:klarCount/total*100,      filter:'klar' },
  { cls:'c-printet', label:'Printet',         value:printetCount, meta:Math.round(printetCount/total*100)+'% klar', pct:printetCount/total*100,   filter:'printet' },
  { cls:'c-mangler', label:'Mangler',         value:manglerCount, meta:Math.round(manglerCount/total*100)+'% af alle', pct:manglerCount/total*100,filter:'ikke-klar' },
];

const filterDefs = [
  { key:'alle',         label:'Alle',           count:total },
  { key:'klar',         label:'Klar til print', count:klarCount },
  { key:'printet',      label:'Printet',        count:printetCount },
  { key:'ikke-klar',    label:'Ikke klar',      count:manglerCount },
  { key:'ikke-printet', label:'Ikke printet',   count:total - printetCount },
];

let activeFilter = 'alle';

function initDate() {
  document.getElementById('dato').textContent =
    new Date().toLocaleDateString('da-DK', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
}

function initKPI() {
  const grid = document.getElementById('kpiGrid');
  kpiDefs.forEach(c => {
    const card = document.createElement('div');
    card.className = 'kpi-card ' + c.cls;
    if (c.filter) {
      card.setAttribute('role', 'button');
      card.setAttribute('tabindex', '0');
      card.setAttribute('aria-label', 'Filtrer: ' + c.label);
      card.addEventListener('click', () => setFilter(c.filter));
      card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setFilter(c.filter); } });
    }

    const lbl = document.createElement('div');
    lbl.className = 'kpi-label';
    lbl.textContent = c.label;

    const val = document.createElement('div');
    val.className = 'kpi-value';
    val.textContent = c.value;

    const meta = document.createElement('div');
    meta.className = 'kpi-meta';
    meta.textContent = c.meta;

    const bar = document.createElement('div');
    bar.className = 'kpi-bar';
    const fill = document.createElement('div');
    fill.className = 'kpi-bar-fill';
    fill.style.width = '0%';
    bar.appendChild(fill);

    card.append(lbl, val, meta, bar);
    grid.appendChild(card);
    setTimeout(() => { fill.style.width = c.pct + '%'; }, 120);
  });
}

function initFilters() {
  const group = document.getElementById('filterGroup');
  filterDefs.forEach(f => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn' + (f.key === 'alle' ? ' active' : '');
    btn.setAttribute('aria-pressed', String(f.key === 'alle'));
    btn.textContent = f.label + ' (' + f.count + ')';
    btn.addEventListener('click', () => setFilter(f.key));
    group.appendChild(btn);
  });
}

function setFilter(key) {
  activeFilter = key;
  document.querySelectorAll('.filter-btn').forEach((btn, i) => {
    const on = filterDefs[i].key === key;
    btn.classList.toggle('active', on);
    btn.setAttribute('aria-pressed', String(on));
  });
  render();
}

function makeBadge(val) {
  const span = document.createElement('span');
  span.className = val === 'SAND' ? 'badge badge-ja' : 'badge badge-nej';
  const dot = document.createElement('span');
  dot.className = 'badge-dot';
  const txt = document.createElement('span');
  txt.textContent = val === 'SAND' ? 'Ja' : 'Nej';
  span.append(dot, txt);
  return span;
}

function makeRetCell(navn, stop) {
  const td = document.createElement('td');
  if (!navn) {
    const d = document.createElement('span');
    d.style.color = '#cbd5e1';
    d.textContent = '—';
    td.appendChild(d);
    return td;
  }
  const name = document.createElement('span');
  name.className = 'ret-navn';
  name.textContent = navn;
  td.appendChild(name);
  if (stop) {
    const s = document.createElement('span');
    s.className = 'ret-stop';
    s.textContent = stop + ' stop';
    td.appendChild(s);
  }
  return td;
}

function render() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const tbody = document.getElementById('tbody');
  tbody.replaceChildren();
  let n = 0;

  for (const row of data) {
    const [linje, r1, r1s, r2, r2s, klar, printet] = row;
    const matchSearch = !q || linje.toLowerCase().includes(q) || r1.toLowerCase().includes(q) || r2.toLowerCase().includes(q);
    const matchFilter =
      activeFilter === 'alle' ||
      (activeFilter === 'klar'         && klar    === 'SAND') ||
      (activeFilter === 'ikke-klar'    && klar    === 'FALSK') ||
      (activeFilter === 'printet'      && printet === 'SAND') ||
      (activeFilter === 'ikke-printet' && printet === 'FALSK');

    if (!matchSearch || !matchFilter) continue;
    n++;

    const tr = document.createElement('tr');

    const tdL = document.createElement('td');
    const b = document.createElement('span');
    b.className = 'linje-badge';
    b.textContent = linje;
    tdL.appendChild(b);
    tr.appendChild(tdL);

    tr.appendChild(makeRetCell(r1, r1s));
    tr.appendChild(makeRetCell(r2, r2s));

    const tdK = document.createElement('td');
    tdK.appendChild(makeBadge(klar));
    tr.appendChild(tdK);

    const tdP = document.createElement('td');
    tdP.appendChild(makeBadge(printet));
    tr.appendChild(tdP);

    tbody.appendChild(tr);
  }

  if (n === 0) {
    const tr = document.createElement('tr');
    const td = document.createElement('td');
    td.colSpan = 5;
    td.className = 'empty-cell';
    td.textContent = 'Ingen linjer matcher søgningen.';
    tr.appendChild(td);
    tbody.appendChild(tr);
  }

  document.getElementById('stats').textContent = n + ' af ' + data.length + ' linjer';
}

initDate();
initKPI();
initFilters();
render();
</script>
</body>
</html>
