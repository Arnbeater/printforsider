<title>Printforsider — Linjeoversigt</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #f5f5f5; color: #1a1a1a; }

  header {
    background: #003865;
    color: white;
    padding: 20px 32px;
  }
  header h1 { font-size: 1.2rem; font-weight: 600; }
  header span { font-size: 0.85rem; opacity: 0.7; }

  .toolbar {
    padding: 16px 32px;
    background: white;
    border-bottom: 1px solid #e0e0e0;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
  }

  input[type="search"] {
    padding: 8px 14px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 0.9rem;
    width: 220px;
    outline: none;
  }
  input[type="search"]:focus { border-color: #003865; }

  .filters { display: flex; gap: 8px; flex-wrap: wrap; }

  button {
    padding: 7px 14px;
    border: 1px solid #ccc;
    border-radius: 6px;
    background: white;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.15s;
  }
  button:hover { background: #f0f0f0; }
  button.active { background: #003865; color: white; border-color: #003865; }

  .stats {
    margin-left: auto;
    font-size: 0.82rem;
    color: #666;
    white-space: nowrap;
  }

  .container { padding: 24px 32px; }

  table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    font-size: 0.875rem;
  }

  thead tr { background: #f0f4f8; }
  th {
    text-align: left;
    padding: 10px 14px;
    font-size: 0.78rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #555;
    white-space: nowrap;
  }

  td { padding: 9px 14px; border-top: 1px solid #f0f0f0; vertical-align: top; }
  tr:hover td { background: #f8fafc; }

  .linje { font-weight: 700; font-size: 1rem; color: #003865; }

  .retning-label {
    font-size: 0.72rem;
    color: #999;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    display: block;
  }
  .retning-navn { color: #1a1a1a; display: block; line-height: 1.4; }
  .stop-count { font-size: 0.75rem; color: #888; display: block; margin-top: 1px; }

  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 0.78rem;
    font-weight: 600;
  }
  .badge-ja { background: #dcfce7; color: #15803d; }
  .badge-nej { background: #fee2e2; color: #b91c1c; }

  .empty {
    text-align: center;
    padding: 60px;
    color: #999;
    font-size: 0.9rem;
    display: none;
  }
</style>
</head>
<body>

<header>
  <h1>Printforsider — Linjeoversigt</h1>
  <span>Movia</span>
</header>

<div class="toolbar">
  <input type="search" id="search" placeholder="Søg linje..." oninput="render()">
  <div class="filters">
    <button class="active" onclick="setFilter('alle', this)">Alle</button>
    <button onclick="setFilter('klar', this)">Klar til print</button>
    <button onclick="setFilter('ikke-klar', this)">Ikke klar</button>
    <button onclick="setFilter('printet', this)">Printet</button>
    <button onclick="setFilter('ikke-printet', this)">Ikke printet</button>

  <div class="stats" id="stats"></div>
</div>

  </table>

</div>

let activeFilter = 'alle';

function makeBadge(val) {
  const span = document.createElement('span');
  span.className = val === 'SAND' ? 'badge badge-ja' : 'badge badge-nej';
  span.textContent = val === 'SAND' ? 'Ja' : 'Nej';
  return span;
}

function makeRetningCell(navn, stop) {
  const td = document.createElement('td');
  if (!navn) {
    const dash = document.createElement('span');
    dash.style.color = '#ccc';
    dash.textContent = '—';
    td.appendChild(dash);
    return td;
  }
  const label = document.createElement('span');
  label.className = 'retning-label';
  label.textContent = 'Ret.';
  const name = document.createElement('span');
  name.className = 'retning-navn';
  name.textContent = navn;
  td.appendChild(label);
  td.appendChild(name);
  if (stop) {
    const s = document.createElement('span');
    s.className = 'stop-count';
    s.textContent = stop + ' stop';
    td.appendChild(s);
  }
  return td;
}

function render() {
  const search = document.getElementById('search').value.trim().toLowerCase();
  const tbody = document.getElementById('tbody');
  const empty = document.getElementById('empty');

  tbody.replaceChildren();
  let visible = 0;

  for (const row of data) {
    const [linje, r1navn, r1stop, r2navn, r2stop, klar, printet] = row;

    const matchSearch = !search
      || linje.toLowerCase().includes(search)
      || r1navn.toLowerCase().includes(search)
      || r2navn.toLowerCase().includes(search);

    const matchFilter =
      activeFilter === 'alle' ||
      (activeFilter === 'klar' && klar === 'SAND') ||
      (activeFilter === 'ikke-klar' && klar === 'FALSK') ||
      (activeFilter === 'printet' && printet === 'SAND') ||
      (activeFilter === 'ikke-printet' && printet === 'FALSK');

    if (!matchSearch || !matchFilter) continue;
    visible++;

    const tr = document.createElement('tr');

    const tdLinje = document.createElement('td');
    const linjeSpan = document.createElement('span');
    linjeSpan.className = 'linje';
    linjeSpan.textContent = linje;
    tdLinje.appendChild(linjeSpan);
    tr.appendChild(tdLinje);

    tr.appendChild(makeRetningCell(r1navn, r1stop));
    tr.appendChild(makeRetningCell(r2navn, r2stop));

    const tdKlar = document.createElement('td');
    tdKlar.appendChild(makeBadge(klar));
    tr.appendChild(tdKlar);

    const tdPrintet = document.createElement('td');
    tdPrintet.appendChild(makeBadge(printet));
    tr.appendChild(tdPrintet);

    tbody.appendChild(tr);
  }

  empty.style.display = visible === 0 ? 'block' : 'none';
  document.getElementById('stats').textContent = 'Viser ' + visible + ' af ' + data.length + ' linjer';
}

function setFilter(f, btn) {
  activeFilter = f;
  document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

render();
