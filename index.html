<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --movia: #003865;
    --movia-light: #e8edf3;
    --green: #16a34a;
    --green-light: #dcfce7;
    --amber: #d97706;
    --amber-light: #fef3c7;
    --blue: #2563eb;
    --blue-light: #dbeafe;
    --gray: #6b7280;
    --gray-light: #f9fafb;
    --border: #e5e7eb;
    --text: #111827;
    --radius: 10px;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: #f3f4f6;
    color: var(--text);
    min-height: 100vh;
  }

  header {
    background: var(--movia);
    color: #fff;
    padding: 0 2rem;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }

  .header-left { display: flex; align-items: center; gap: 1rem; }

  .logo-mark {
    width: 36px; height: 36px;
    background: #fff;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
  }

  .logo-mark span {
    color: var(--movia);
    font-weight: 700;
    font-size: 14px;
    letter-spacing: -0.5px;
  }

  header h1 { font-size: 1rem; font-weight: 600; letter-spacing: 0.01em; }
  header p { font-size: 0.75rem; opacity: 0.7; margin-top: 1px; }

  .header-right { display: flex; align-items: center; gap: 0.75rem; }

  #readonly-banner {
    display: none;
    background: var(--amber);
    color: #fff;
    font-size: 0.75rem;
    font-weight: 600;
    padding: 0.3rem 0.75rem;
    border-radius: 6px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }

  #share-btn {
    background: rgba(255,255,255,0.15);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.3);
    padding: 0.4rem 0.9rem;
    border-radius: 7px;
    font-size: 0.8rem;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s;
    font-family: inherit;
    display: flex; align-items: center; gap: 0.4rem;
  }
  #share-btn:hover { background: rgba(255,255,255,0.25); }

  .main { max-width: 1100px; margin: 0 auto; padding: 2rem; }

  /* KPI cards */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 1rem;
    margin-bottom: 2rem;
  }

  .kpi-card {
    background: #fff;
    border-radius: var(--radius);
    padding: 1.25rem 1.5rem;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }

  .kpi-label { font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--gray); margin-bottom: 0.4rem; }
  .kpi-value { font-size: 2rem; font-weight: 700; line-height: 1; }
  .kpi-value.total { color: var(--movia); }
  .kpi-value.ready { color: var(--amber); }
  .kpi-value.printed { color: var(--green); }
  .kpi-value.remaining { color: var(--blue); }

  .kpi-sub { font-size: 0.75rem; color: var(--gray); margin-top: 0.3rem; }

  .progress-bar {
    height: 5px;
    background: var(--border);
    border-radius: 99px;
    margin-top: 0.75rem;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    border-radius: 99px;
    transition: width 0.4s ease;
  }
  .progress-fill.amber { background: var(--amber); }
  .progress-fill.green { background: var(--green); }

  /* Controls */
  .controls {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 1.25rem;
    flex-wrap: wrap;
  }

  .filter-btn {
    padding: 0.45rem 1rem;
    border-radius: 7px;
    border: 1.5px solid var(--border);
    background: #fff;
    font-size: 0.8rem;
    font-weight: 500;
    cursor: pointer;
    color: var(--gray);
    font-family: inherit;
    transition: all 0.12s;
    display: flex; align-items: center; gap: 0.35rem;
  }
  .filter-btn:hover { border-color: var(--movia); color: var(--movia); }
  .filter-btn.active { background: var(--movia); border-color: var(--movia); color: #fff; }

  .badge-count {
    background: rgba(255,255,255,0.25);
    padding: 0 5px;
    border-radius: 4px;
    font-size: 0.7rem;
    font-weight: 600;
  }
  .filter-btn:not(.active) .badge-count { background: var(--movia-light); color: var(--movia); }

  .search-wrap { margin-left: auto; }
  #search {
    padding: 0.45rem 0.85rem;
    border: 1.5px solid var(--border);
    border-radius: 7px;
    font-size: 0.8rem;
    font-family: inherit;
    outline: none;
    width: 180px;
    transition: border-color 0.12s;
  }
  #search:focus { border-color: var(--movia); }

  /* Table */
  .table-wrap {
    background: #fff;
    border-radius: var(--radius);
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    overflow: hidden;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85rem;
  }

  thead th {
    background: var(--movia);
    color: #fff;
    font-size: 0.72rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 0.75rem 1rem;
    text-align: left;
  }

  thead th.center { text-align: center; }

  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.1s;
  }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--gray-light); }
  tbody tr.hidden { display: none; }

  td { padding: 0.7rem 1rem; vertical-align: middle; }
  td.center { text-align: center; }

  .linje-badge {
    display: inline-block;
    background: var(--movia-light);
    color: var(--movia);
    font-weight: 700;
    font-size: 0.8rem;
    padding: 0.2rem 0.5rem;
    border-radius: 5px;
    min-width: 38px;
    text-align: center;
  }

  .stop-count {
    font-size: 0.78rem;
    color: var(--gray);
    font-weight: 500;
  }

  /* Toggle buttons */
  .toggle-btn {
    width: 36px; height: 36px;
    border-radius: 8px;
    border: 2px solid var(--border);
    background: #fff;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    color: var(--border);
  }
  .toggle-btn:hover { border-color: var(--gray); color: var(--gray); }
  .toggle-btn.checked-amber { background: var(--amber-light); border-color: var(--amber); color: var(--amber); }
  .toggle-btn.checked-green { background: var(--green-light); border-color: var(--green); color: var(--green); }

  /* Static badges for read-only */
  .status-badge {
    display: inline-block;
    padding: 0.2rem 0.6rem;
    border-radius: 5px;
    font-size: 0.72rem;
    font-weight: 600;
  }
  .status-badge.yes-amber { background: var(--amber-light); color: var(--amber); }
  .status-badge.yes-green { background: var(--green-light); color: var(--green); }
  .status-badge.no { background: var(--border); color: var(--gray); }

  /* Toast */
  #toast {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #111827;
    color: #fff;
    padding: 0.6rem 1.25rem;
    border-radius: 8px;
    font-size: 0.82rem;
    font-weight: 500;
    opacity: 0;
    transition: all 0.2s ease;
    pointer-events: none;
    z-index: 200;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 640px) {
    .main { padding: 1rem; }
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .search-wrap { margin-left: 0; width: 100%; }
    #search { width: 100%; }
    thead th:nth-child(3), td:nth-child(3) { display: none; }
  }
</style>

    </button>
    <button class="filter-btn" id="filter-pending" onclick="setFilter('pending')">
      Mangler <span class="badge-count" id="cnt-pending">0</span>
    </button>
    <div class="search-wrap">
      <input type="search" id="search" placeholder="Søg linje..." oninput="applyFilters()">
    </div>
  </div>

  <div class="table-wrap">

      </thead>

    </table>
  </div>
</div>

const STORAGE_KEY = 'printforsider_state_v2';
let isReadOnly = false;
let currentFilter = 'all';
let state = {};

function loadFromHash() {
  const hash = location.hash;
  if (!hash.startsWith('#s=')) return false;
  try {
    const raw = decodeURIComponent(escape(atob(hash.slice(3))));
    state = JSON.parse(raw);
    isReadOnly = true;
    return true;
  } catch (_) { return false; }
}

function loadFromStorage() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) state = JSON.parse(saved);
  } catch (_) { state = {}; }
}

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (_) {}
}

function getState(linje) {
  return state[linje] || { k: false, p: false };
}

function toggle(linje, field) {
  if (isReadOnly) return;
  const s = { ...getState(linje) };
  s[field] = !s[field];
  if (field === 'p' && s.p) s.k = true;
  if (field === 'k' && !s.k) s.p = false;
  state[linje] = s;
  saveState();
  updateKPI();
  updateFilterCounts();
  updateRow(linje);
  applyFilters();
}

function makeSvgCheck(color) {
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('fill', 'none');
  svg.setAttribute('stroke', color);
  svg.setAttribute('stroke-width', '2.5');
  svg.setAttribute('stroke-linecap', 'round');
  svg.setAttribute('stroke-linejoin', 'round');
  svg.setAttribute('width', '16');
  svg.setAttribute('height', '16');
  svg.setAttribute('aria-hidden', 'true');
  const poly = document.createElementNS(ns, 'polyline');
  poly.setAttribute('points', '20 6 9 17 4 12');
  svg.appendChild(poly);
  return svg;
}

function makeSvgCircle() {
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('fill', 'none');
  svg.setAttribute('stroke', 'currentColor');
  svg.setAttribute('stroke-width', '1.5');
  svg.setAttribute('width', '16');
  svg.setAttribute('height', '16');
  svg.setAttribute('aria-hidden', 'true');
  const circle = document.createElementNS(ns, 'circle');
  circle.setAttribute('cx', '12');
  circle.setAttribute('cy', '12');
  circle.setAttribute('r', '9');
  svg.appendChild(circle);
  return svg;
}

function makeSvgShare() {
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('fill', 'none');
  svg.setAttribute('stroke', 'currentColor');
  svg.setAttribute('stroke-width', '2');
  svg.setAttribute('stroke-linecap', 'round');
  svg.setAttribute('stroke-linejoin', 'round');
  svg.setAttribute('width', '14');
  svg.setAttribute('height', '14');
  svg.setAttribute('aria-hidden', 'true');
  const path = document.createElementNS(ns, 'path');
  path.setAttribute('d', 'M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8');
  const polyline = document.createElementNS(ns, 'polyline');
  polyline.setAttribute('points', '16 6 12 2 8 6');
  const line = document.createElementNS(ns, 'line');
  line.setAttribute('x1', '12'); line.setAttribute('y1', '2');
  line.setAttribute('x2', '12'); line.setAttribute('y2', '15');
  svg.appendChild(path);
  svg.appendChild(polyline);
  svg.appendChild(line);
  return svg;
}

function createToggleBtn(linje, field, checked, colorClass) {
  const btn = document.createElement('button');
  btn.className = 'toggle-btn' + (checked ? ' ' + colorClass : '');
  btn.setAttribute('aria-pressed', checked ? 'true' : 'false');
  btn.setAttribute('data-linje', linje);
  btn.setAttribute('data-field', field);
  btn.onclick = function() { toggle(linje, field); };
  if (checked) {
    btn.appendChild(makeSvgCheck(colorClass === 'checked-amber' ? '#d97706' : '#16a34a'));
  } else {
    btn.appendChild(makeSvgCircle());
  }
  return btn;
}

function createStaticBadge(checked, labelYes, labelNo, colorClass) {
  const span = document.createElement('span');
  span.className = 'status-badge ' + (checked ? colorClass : 'no');
  span.textContent = checked ? labelYes : labelNo;
  return span;
}

function buildRow(line) {
  const [linje, ret1, ret2, stop] = line;
  const s = getState(linje);
  const tr = document.createElement('tr');
  tr.setAttribute('data-linje', linje);
  tr.setAttribute('data-k', s.k ? '1' : '0');
  tr.setAttribute('data-p', s.p ? '1' : '0');

  const tdLinje = document.createElement('td');
  const badge = document.createElement('span');
  badge.className = 'linje-badge';
  badge.textContent = linje;
  tdLinje.appendChild(badge);
  tr.appendChild(tdLinje);

  const tdR1 = document.createElement('td');
  tdR1.textContent = ret1;
  tr.appendChild(tdR1);

  const tdR2 = document.createElement('td');
  tdR2.textContent = ret2;
  tr.appendChild(tdR2);

  const tdStop = document.createElement('td');
  tdStop.className = 'center';
  const stopSpan = document.createElement('span');
  stopSpan.className = 'stop-count';
  stopSpan.textContent = stop;
  tdStop.appendChild(stopSpan);
  tr.appendChild(tdStop);

  const tdK = document.createElement('td');
  tdK.className = 'center';
  if (isReadOnly) {
    tdK.appendChild(createStaticBadge(s.k, 'Klar', 'Nej', 'yes-amber'));
  } else {
    tdK.appendChild(createToggleBtn(linje, 'k', s.k, 'checked-amber'));
  }
  tr.appendChild(tdK);

  const tdP = document.createElement('td');
  tdP.className = 'center';
  if (isReadOnly) {
    tdP.appendChild(createStaticBadge(s.p, 'Printet', 'Nej', 'yes-green'));
  } else {
    tdP.appendChild(createToggleBtn(linje, 'p', s.p, 'checked-green'));
  }
  tr.appendChild(tdP);

  return tr;
}

function updateRow(linje) {
  const s = getState(linje);
  const tr = document.querySelector('tr[data-linje="' + linje + '"]');
  if (!tr) return;
  tr.setAttribute('data-k', s.k ? '1' : '0');
  tr.setAttribute('data-p', s.p ? '1' : '0');

  const tds = tr.querySelectorAll('td');
  const tdK = tds[4];
  const tdP = tds[5];
  tdK.replaceChildren(createToggleBtn(linje, 'k', s.k, 'checked-amber'));
  tdP.replaceChildren(createToggleBtn(linje, 'p', s.p, 'checked-green'));
}

function updateKPI() {
  const total = LINES.length;
  let ready = 0, printed = 0;
  LINES.forEach(([linje]) => {
    const s = getState(linje);
    if (s.k) ready++;
    if (s.p) printed++;
  });
  const remaining = total - printed;
  document.getElementById('kpi-total').textContent = total;
  document.getElementById('kpi-ready').textContent = ready;
  document.getElementById('kpi-ready-pct').textContent = Math.round(ready/total*100) + '% af linjer';
  document.getElementById('bar-ready').style.width = (ready/total*100) + '%';
  document.getElementById('kpi-printed').textContent = printed;
  document.getElementById('kpi-printed-pct').textContent = Math.round(printed/total*100) + '% færdige';
  document.getElementById('bar-printed').style.width = (printed/total*100) + '%';
  document.getElementById('kpi-remaining').textContent = remaining;
}

function updateFilterCounts() {
  let all = 0, ready = 0, printed = 0, pending = 0;
  LINES.forEach(([linje]) => {
    const s = getState(linje);
    all++;
    if (s.k) ready++;
    if (s.p) printed++;
    if (!s.p) pending++;
  });
  document.getElementById('cnt-all').textContent = all;
  document.getElementById('cnt-ready').textContent = ready;
  document.getElementById('cnt-printed').textContent = printed;
  document.getElementById('cnt-pending').textContent = pending;
}

function setFilter(f) {
  currentFilter = f;
  ['all','ready','printed','pending'].forEach(id => {
    document.getElementById('filter-' + id).classList.toggle('active', id === f);
  });
  applyFilters();
}

function applyFilters() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  document.querySelectorAll('tbody tr').forEach(tr => {
    const linje = tr.getAttribute('data-linje');
    const k = tr.getAttribute('data-k') === '1';
    const p = tr.getAttribute('data-p') === '1';
    let show = true;
    if (currentFilter === 'ready' && !k) show = false;
    if (currentFilter === 'printed' && !p) show = false;
    if (currentFilter === 'pending' && p) show = false;
    if (q && !linje.toLowerCase().includes(q)) show = false;
    tr.classList.toggle('hidden', !show);
  });
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

function shareView() {
  const payload = btoa(unescape(encodeURIComponent(JSON.stringify(state))));
  const url = location.origin + location.pathname + '#s=' + payload;
  navigator.clipboard.writeText(url).then(() => {
    showToast('Link kopieret til udklipsholder');
  }).catch(() => {
    showToast('Kunne ikke kopiere — se konsol');
    console.log(url);
  });
}

function init() {
  const fromHash = loadFromHash();
  if (!fromHash) loadFromStorage();

  const tbody = document.getElementById('tbody');
  LINES.forEach(line => tbody.appendChild(buildRow(line)));

  updateKPI();
  updateFilterCounts();

  const shareBtn = document.getElementById('share-btn');
  shareBtn.appendChild(makeSvgShare());
  const label = document.createTextNode(' Del view');
  shareBtn.appendChild(label);

  if (isReadOnly) {
    document.getElementById('readonly-banner').style.display = 'inline-block';
    shareBtn.style.display = 'none';
  }
}

init();
</script>
</body>
</html>
